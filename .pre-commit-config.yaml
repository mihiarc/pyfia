# Pre-commit hooks for pyFIA - simplified configuration
# See https://pre-commit.com for more information

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^tests/fixtures/fiadb_al/
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]
      # Run the linter
      - id: ruff
        types_or: [python, pyi]
        args: [--fix, --exit-non-zero-on-fix]

  # Type checking with the project's own mypy and locked dependencies, as CI runs it
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/pyfia/
        language: system
        files: ^src/pyfia/
        pass_filenames: false

# Configuration for specific hooks
files: ^(src/pyfia/|tests/|docs/)
exclude: ^(\.git/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/|build/|dist/|.*\.egg-info/|htmlcov/)